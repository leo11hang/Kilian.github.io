- id: faq-067
  badges:
    - text: 两步验证机制
      tone: blue
    - text: 高频误区
      tone: red
  blocks:
    - type: comparison
      title: 关键概念避坑
      items:
        - tone: danger
          text: 仅在 App 中添加绑定密钥
        - tone: success
          text: 账号总开关正式开启了两步验证
    - type: callout
      tone: warning
      title: 注意
      text: 添加了谷歌验证器，不等于已经开启两步验证。
    - type: steps
      title: 排查与解决步骤
      items:
        - title: 登录 Google 账号管理后台
          text: 打开账号安全设置：
          url: https://myaccount.google.com/security
        - title: 找到两步验证
          text: 在“登录 Google 的方式”中找到“两步验证”选项。
        - title: 确认总开关状态
          text: 确保两步验证总状态显示为“已开启（On）”。
        - title: 完成最后确认
          text: 扫描二维码或输入密钥后，还要在网页端输入验证码，并点击“开启”或“完成”保存；只扫码后关闭页面不会完成绑定。

- id: faq-068
  badges:
    - text: 支付设置
      tone: green
    - text: 换区 / 解绑常见报错
      tone: amber
  blocks:
    - type: callout
      tone: neutral
      title: 核心认知区别
      text: 删除付款方式或银行卡，不等于关闭付款资料（Payments Profile）。单纯解绑卡片，付款资料主体仍然存在，因此相关区域或资料限制不一定会解除。
    - type: action_link
      title: 付款资料设置直达地址
      url: https://payments.google.com/gp/w/home/settings
      open_label: 前往设置
      copy_label: 复制链接
    - type: steps
      title: 正确关闭操作流程
      items:
        - title: 打开付款资料设置
          text: 打开上方链接，并确认当前登录的是需要处理的 Google 账号。
        - title: 找到关闭入口
          text: 在页面中找到“关闭付款资料”（Close payments profile）。入口位置可能随页面版本变化。
        - title: 查看影响并确认
          text: 阅读 Google 页面显示的影响，选择原因并按页面提示提交。
    - type: callout
      tone: purple
      title: 页面仍提示报错时
      text: 如果页面没有显示已绑定的付款方式，但换区或更改资料时仍出现该提示，请先核对账号和付款资料状态，并联系 Google 支持处理。不要添加虚假银行卡或测试卡，也不要为了绕过限制提交不真实的付款信息。

- id: faq-069
  badges:
    - text: 验证码故障
      tone: red
    - text: TOTP 同步
      tone: slate
  intro: 输入 Authenticator 上显示的 6 位动态数字后，如果系统提示错误或不匹配，通常可以先检查下面两项。
  blocks:
    - type: numbered_cards
      items:
        - title: 未完成网页端的最后保存
          text: 添加 Google Authenticator 后，必须回到发起绑定的网页点击“下一步”，输入新生成的验证码并完成确认。如果直接关闭网页，旧绑定可能没有建立，刚添加的验证码也不会被该账号接受。
        - title: 手机系统时间不同步（时差误差）
          text: 动态验证码（TOTP）依赖设备时间。请在手机设置中开启自动设置日期、时间及时区，再等待验证码刷新后重新输入。较新版本的 Authenticator 使用设备系统时间；如果你的应用版本提供时间校正选项，也可以按应用内提示操作。

- id: faq-070
  badges:
    - text: 凭证格式规范
      tone: blue
    - text: 输入区别
      tone: amber
  intro: 在验证器、登录脚本或客户端中设置两步验证时，需要区分密钥、动态验证码和备用码这三类内容。
  blocks:
    - type: cards
      items:
        - badge: 设置密钥（Secret Key）
          tone: blue
          title: 用于添加 / 绑定账号
          text: 由要保护的服务在绑定验证器时提供，也可能以二维码形式展示。添加到 Authenticator 后用于生成动态验证码。
          example: 示例密钥：JBSWY3DPEHPK3PXP…
        - badge: 动态验证码（TOTP）
          tone: slate
          title: 6 位数字
          text: 验证器根据密钥和设备时间生成，短时间后会自动更换，用于登录验证或完成绑定确认。
          example: 每次登录时输入当前显示的验证码
        - badge: 备用验证码（Backup）
          tone: green
          title: Google 账号通常为 8 位数字
          text: 手机丢失或无法使用常规验证方式时应急使用。每个备用码通常只能使用一次。
          example: 请使用账号页面生成的个人备用码
    - type: takeaway
      text: 绑定验证器时填入服务提供的设置密钥；登录时填入动态验证码。只有在页面明确要求备用码时，才填写对应的备用码。密钥长度和格式由服务决定，并非所有服务都使用 32 位密钥。

- id: faq-071
  badges:
    - text: Google Play 订阅
      tone: green
    - text: YouTube / Gemini Pro 套餐
      tone: amber
  blocks:
    - type: callout
      tone: neutral
      title: 显示机制说明
      text: Google 账号开启自动扣费时，订阅页面通常显示下一次自动扣款或计费日期；这不一定等同于当前已付款周期的最终服务截止日期。
    - type: action_link
      title: Google Play 订阅中心直达地址
      url: https://play.google.com/store/account/subscriptions
      open_label: 前往订阅管理
      copy_label: 复制链接
      tone: green
    - type: steps
      title: 查看订阅状态与日期
      items:
        - title: 打开订阅管理
          text: 使用上方链接打开 Google Play 订阅中心，并确认登录的是购买订阅时使用的 Google 账号。
        - title: 找到目标订阅
          text: 找到对应的 YouTube 或 Gemini / Google AI 套餐，打开“管理”（Manage）。
        - title: 查看当前状态
          text: 页面会显示续费、取消或已到期状态及相应日期。若你决定停止后续自动续费，再按页面提示取消并确认。
        - title: 核对服务截止日
          text: 取消后刷新订阅页面，查看页面显示的“服务将在 YYYY-MM-DD 到期”等状态文案；以当前账号页面显示为准。
    - type: callout
      tone: green
      title: 关于已付费权益
      text: 取消自动续费通常不会立即结束当前已付款周期的服务；具体权益保留时间、退款和到期规则以 Google Play 或对应购买渠道的页面说明为准。只想查看续费信息时，不必先取消订阅。

- id: faq-072
  badges:
    - text: 浏览器授权
      tone: blue
    - text: 回跳排查
      tone: amber
  intro: PDF 将浏览器已登录但 Antigravity 仍转圈归因于浏览器与应用使用的网络通路不同，并给出 TUN 和账号切换工具的处理经验。
  blocks:
    - type: steps
      title: PDF 中记录的处理流程
      items:
        - title: 启用 TUN / 虚拟网卡
          text: PDF 建议打开网络工具的 TUN 模式或虚拟网卡模式，让浏览器与 Antigravity 使用同一网络通路后重试。
        - title: 下载 Antigravity Tools
          text: 如果仍未跳回，PDF 建议从下方 Release 页面下载与系统对应的安装包。
        - title: 添加并切换账号
          text: PDF 记录的操作是打开工具，点击右上角添加账号并进行 OAuth 授权，然后使用一键切换；平时可在账号管理中勾选账号后点击转换。
        - title: 退出后重新登录
          text: PDF 建议遇到 Antigravity 内的错误时，在 Settings → Account → Sign out 退出，再重新登录并重试。
    - type: action_link
      title: PDF 提到的 Antigravity Tools Release
      url: https://github.com/lbjlaq/Antigravity-Manager/releases
      open_label: 打开 Release 页面
      copy_label: 复制链接

- id: faq-073
  badges:
    - text: 账号资格
      tone: blue
    - text: 账号地区
      tone: amber
  intro: PDF 将 account ineligible 归因于 Google 账号关联地区不在 Antigravity 支持范围，并列出了查看地区和提交申请的办法。
  blocks:
    - type: steps
      title: PDF 中记录的地区排查
      items:
        - title: 查看 Google 账号地区
          text: 在 Google 服务条款页面查看账号当前关联地区。
        - title: 对照 Antigravity 支持地区
          text: 打开 Antigravity FAQ，检查账号关联地区是否在 PDF 所引用的支持地区列表中。
        - title: 提交地区申请
          text: PDF 建议通过 Google 关联地区申请表提交更改请求，并等待 Google 回复。
    - type: callout
      tone: neutral
      title: PDF 对申请频率的说明
      text: PDF 称该地区更改每年只允许一次，并提醒提交后等待 Google 回复。
    - type: callout
      tone: neutral
      title: PDF 转述的用户申请经验
      text: 文档记录了两种用户说法：一种称直接填写“我住这”后申请通过，另一种称选择“以上都不是”并说明工作需要；作者还称有 4–5 个账号采用第一种方式通过。
    - type: action_link
      title: Google Antigravity 登录与地区说明
      url: https://antigravity.google/docs/faq
      open_label: 查看官方 FAQ
      copy_label: 复制链接
    - type: action_link
      title: Google 服务条款页
      url: https://policies.google.com/terms
      open_label: 查看账号关联地区
      copy_label: 复制链接
    - type: action_link
      title: Google 账号关联地区更正申请
      url: https://policies.google.com/country-association-form
      open_label: 查看申请入口
      copy_label: 复制链接

- id: faq-074
  badges:
    - text: 扫码验证
      tone: blue
    - text: 二维码流程
      tone: green
  intro: PDF 记录了 Google 登录要求扫描二维码、短信验证码收不到或验证流程没有反应时的处理经验。
  blocks:
    - type: steps
      title: PDF 中记录的扫码尝试
      items:
        - title: 先试手机原生相机
          text: PDF 作者称用手机自带相机扫描二维码，有时可以继续验证而不进入短信步骤，并举了小米设备作为个案。
        - title: 再试 Google App 扫码
          text: PDF 建议在手机或 iPad 的 Google App 中登录一个可用的 Google 账号，再用 App 内扫码功能扫描页面二维码；原文还提到 Google 基础服务设置。
        - title: 短信仍未完成时
          text: PDF 记录的尝试包括更换网络节点、Google App 中的账号或设备后重试；作者没有提供可复现的成功条件。
        - title: 验证通过后返回应用
          text: Google 页面显示身份认证成功后，返回 Antigravity 选择“Sign in again”，再登录目标账号。
    - type: action_link
      title: PDF 引用的 Antigravity 官方 FAQ
      url: https://antigravity.google/docs/faq
      open_label: 打开官方 FAQ
      copy_label: 复制链接

- id: faq-075
  badges:
    - text: 验证已完成
      tone: green
    - text: 仍提示 Verify
      tone: amber
  intro: PDF 记录了通过 Antigravity FAQ 打开年龄验证页面、完成验证后返回应用继续登录的流程。
  blocks:
    - type: steps
      title: PDF 中记录的年龄验证流程
      items:
        - title: 打开年龄验证
          text: 按 PDF 提供的链接打开 Google 账号年龄验证页面。
        - title: 选择页面提供的方式
          text: PDF 记录了自拍验证和上传证件两种方式，并推荐自拍验证；可按页面当时提供的选项继续。
        - title: 手机扫码完成人脸验证
          text: PDF 称自拍流程会显示二维码，也可以选择链接并在手机浏览器打开，随后按页面完成验证。
        - title: 返回 Antigravity
          text: 页面显示身份验证成功后，返回 Antigravity 选择“Sign in again”，重新登录目标账号。
    - type: callout
      tone: neutral
      title: PDF 中的经验说法
      text: PDF 作者称同一张脸可以反复通过自拍扫描；这是文档中的个人经验描述。
    - type: action_link
      title: PDF 引用的 Google 年龄验证页面
      url: https://myaccount.google.com/age-verification
      open_label: 打开年龄验证
      copy_label: 复制链接

- id: faq-076
  badges:
    - text: Sign in again
      tone: blue
    - text: 授权循环
      tone: amber
  intro: PDF 记录了浏览器身份验证成功后，Antigravity 仍反复要求 Verify 或 Sign in again 的情况。
  blocks:
    - type: steps
      title: PDF 中记录的处理流程
      items:
        - title: 打开年龄验证页面
          text: PDF 建议通过 Antigravity FAQ 进入 Google 账号年龄验证页面，按页面完成验证。
        - title: 再次登录
          text: 验证成功后返回 Antigravity，选择“Sign in again”并重新登录。
        - title: 仍在循环时
          text: PDF 建议在应用 Settings → Account → Sign out 退出账号，再重新登录并重试。
    - type: action_link
      title: PDF 引用的 Antigravity 官方 FAQ
      url: https://antigravity.google/docs/faq
      open_label: 打开官方 FAQ
      copy_label: 复制链接
    - type: action_link
      title: PDF 引用的 Google 年龄验证页面
      url: https://myaccount.google.com/age-verification
      open_label: 打开年龄验证
      copy_label: 复制链接

- id: faq-077
  badges:
    - text: EOF
      tone: amber
    - text: 请求中断
      tone: blue
  intro: PDF 中的 daily-cloudcode-pa.googleapis.com onboardUser 请求返回 EOF；PDF 将其归因于网络错误和节点质量。
  blocks:
    - type: steps
      title: PDF 中给出的尝试
      items:
        - title: 更换网络节点
          text: PDF 建议切换到其他节点后再次尝试。
        - title: 启用 TUN / 虚拟网卡
          text: PDF 建议开启网络工具的 TUN 模式或虚拟网卡模式后重试。

- id: faq-078
  badges:
    - text: invalid_grant
      tone: amber
    - text: 授权错误
      tone: blue
  intro: PDF 将 invalid_grant 解释为 Antigravity 中该账号的 OAuth 登录状态过期。
  blocks:
    - type: steps
      title: PDF 中给出的重新登录方式
      items:
        - title: 重新选择账号入口
          text: 在 Antigravity 中点击“Continue with different account”。
        - title: 登录原账号
          text: 按 PDF 说明重新登录出现错误的那个 Google 账号。

- id: faq-079
  badges:
    - text: 请求超时
      tone: amber
    - text: context deadline exceeded
      tone: blue
  intro: PDF 将 context deadline exceeded 归纳为请求超时，并建议重新尝试。
  blocks:
    - type: steps
      title: PDF 中的处理方式
      items:
        - title: 重试
          text: 按 PDF 建议重新尝试请求。
    - type: callout
      tone: neutral
      title: PDF 中其他错误的网络尝试
      text: PDF 在 EOF 和其他 Unexpected issue 段落中还建议切换节点或开启 TUN/虚拟网卡。

- id: faq-080
  badges:
    - text: Unexpected issue
      tone: amber
    - text: 通用排查
      tone: blue
  intro: PDF 将其他 daily-cloudcode Unexpected issue 归纳为网络问题，并建议更换节点或开启 TUN/虚拟网卡。
  blocks:
    - type: steps
      title: PDF 中给出的网络尝试
      items:
        - title: 更换网络节点
          text: PDF 建议切换到其他节点后重试。
        - title: 启用 TUN / 虚拟网卡
          text: PDF 建议开启网络工具的 TUN 模式或虚拟网卡模式后再试。

- id: faq-081
  badges:
    - text: 产品简介
      tone: blue
    - text: PDF 模型截图
      tone: amber
  intro: PDF 介绍了 Antigravity 2.0 和 Vibe Coding，并列出首页与模型选择器截图中的模型。
  blocks:
    - type: cards
      items:
        - badge: PDF 截图名单
          tone: blue
          title: PDF 截图中的模型选择器
          text: 截图展示了 Gemini 3.5 Flash（Medium / High / Low）、Gemini 3.1 Pro（High / Low）、Claude Sonnet 4.6（Thinking）、Claude Opus 4.6（Thinking）和 GPT-OSS 120B（Medium）。
          example: PDF 首页还列出 Gemini 3.5 Flash、Claude Opus 4.6（Thinking）和 Gemini 3.1 Pro（High）。

