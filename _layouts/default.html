<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | truncate: 150 }}{% else %}{{ site.description }}{% endif %}" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  {% seo %}
</head>
<body>

<!-- SVG Sprite -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="ic-home" viewBox="0 0 20 20"><path fill="currentColor" d="M10 2L2 9h2v8h5v-5h2v5h5V9h2L10 2z"/></symbol>
  <symbol id="ic-robot" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="8" width="10" height="9" rx="2"/><rect x="8" y="3" width="4" height="4" rx="1"/><line x1="10" y1="7" x2="10" y2="8"/><circle cx="8" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="ic-key" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="9" r="4.5"/><path d="M11 12l5 5" stroke-linecap="round"/><path d="M14 15l2-2" stroke-linecap="round"/></symbol>
  <symbol id="ic-download" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v9m0 0l-3.5-3.5M10 12l3.5-3.5"/><path d="M4 16h12"/></symbol>
  <symbol id="ic-faq" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="10" r="7.5"/><path d="M7.5 8a2.5 2.5 0 015 .5c0 1.5-2.5 2-2.5 3.5" stroke-linecap="round"/><circle cx="10" cy="15" r="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="ic-search" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M15 15l-3.5-3.5" stroke-linecap="round"/></symbol>
  <symbol id="ic-cart" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h1.5l2.1 8.4a1 1 0 001 .6h6.8a1 1 0 00.97-.75L17 7H6"/><circle cx="9" cy="17" r="1.3" fill="currentColor" stroke="none"/><circle cx="14" cy="17" r="1.3" fill="currentColor" stroke="none"/></symbol>
  <symbol id="ic-pin" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M10 2a4 4 0 014 4c0 2-1 3.5-2.5 4.5L12 17l-2-1-2 1 .5-6.5C7 9.5 6 8 6 6a4 4 0 014-4z"/></symbol>
  <symbol id="ic-up" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15V5m0 0L5 10m5-5l5 5"/></symbol>
  <symbol id="ic-calendar" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="14" height="13" rx="2"/><path d="M7 2v3M13 2v3M3 8h14" stroke-linecap="round"/></symbol>
  <symbol id="ic-user" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="7" r="3.5"/><path d="M4 17c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke-linecap="round"/></symbol>
  <symbol id="ic-clock" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="10" cy="10" r="7.5"/><path d="M10 6v4l2.5 2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="ic-bolt" viewBox="0 0 20 20"><path d="M11 2L4 11h7l-2 7 7-9h-7l2-7z" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="ic-doc" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 3h7l3 3v11a1 1 0 01-1 1H5a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M12 3v4h4" stroke-linecap="round"/></symbol>
  <symbol id="ic-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="11" y2="18"/></symbol>
</svg>

<!-- 阅读进度条 -->
<div id="progress-bar"></div>

<header class="site-header">
  <div class="header-inner">
    <a class="site-logo" href="{{ '/' | relative_url }}">
      <div class="logo-mark">
        <svg viewBox="0 0 16 16"><path d="M8 1L10.5 6H15L11 9.5L12.5 15L8 12L3.5 15L5 9.5L1 6H5.5L8 1Z"/></svg>
      </div>
      {{ site.title }}
    </a>

    <nav class="site-nav" aria-label="主导航">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>首页</a>
      <a href="{{ '/tutorial/' | relative_url }}"{% if page.url contains 'tutorial' %} class="active"{% endif %}>AI教程</a>
      <a href="{{ '/activation/' | relative_url }}"{% if page.url contains 'activation' %} class="active"{% endif %}>激活教程</a>
      <a href="{{ '/download/' | relative_url }}"{% if page.url contains 'download' %} class="active"{% endif %}>软件下载</a>
      <a href="{{ '/faq/' | relative_url }}"{% if page.url contains 'faq' %} class="active"{% endif %}>常见问题</a>
      <a href="{{ '/search/' | relative_url }}"{% if page.url contains 'search' %} class="active"{% endif %}>
        <svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" style="vertical-align:middle;margin-right:3px"><circle cx="8.5" cy="8.5" r="6"/><path d="M15 15l-3.5-3.5"/></svg>搜索
      </a>
    </nav>

    <div class="header-right">
      <a class="btn-contact" href="mailto:kkluv2022@outlook.com">
        <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/><path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/></svg>
        联系站长
      </a>
      <button class="menu-toggle" id="menuToggle" aria-label="打开菜单" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<!-- 移动端导航抽屉 -->
<nav class="mobile-nav" id="mobileNav" aria-label="移动端导航">
  <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}><svg width="16" height="16" aria-hidden="true" focusable="false"><use href="#ic-home"/></svg> 首页</a>
  <a href="{{ '/tutorial/' | relative_url }}"{% if page.url contains 'tutorial' %} class="active"{% endif %}><svg width="16" height="16" aria-hidden="true" focusable="false"><use href="#ic-robot"/></svg> AI教程</a>
  <a href="{{ '/activation/' | relative_url }}"{% if page.url contains 'activation' %} class="active"{% endif %}><svg width="16" height="16" aria-hidden="true" focusable="false"><use href="#ic-key"/></svg> 激活教程</a>
  <a href="{{ '/download/' | relative_url }}"{% if page.url contains 'download' %} class="active"{% endif %}><svg width="16" height="16" aria-hidden="true" focusable="false"><use href="#ic-download"/></svg> 软件下载</a>
  <a href="{{ '/faq/' | relative_url }}"{% if page.url contains 'faq' %} class="active"{% endif %}><svg width="16" height="16" aria-hidden="true" focusable="false"><use href="#ic-faq"/></svg> 常见问题</a>
  <a href="{{ '/search/' | relative_url }}"{% if page.url contains 'search' %} class="active"{% endif %}><svg width="16" height="16" aria-hidden="true" focusable="false"><use href="#ic-search"/></svg> 搜索文章</a>
  <a href="{{ site.activation_site }}" target="_blank" rel="noopener" class="nav-cta"><svg width="16" height="16" aria-hidden="true" focusable="false"><use href="#ic-cart"/></svg> 立即购买激活码</a>
</nav>

{{ content }}

<!-- 返回顶部 -->
<button id="back-to-top" aria-label="返回顶部" title="返回顶部"><svg width="18" height="18" aria-hidden="true" focusable="false"><use href="#ic-up"/></svg></button>

<a class="float-cta" href="{{ site.activation_site }}" target="_blank" rel="noopener">
  <div class="float-cta-dot"></div>
  <span class="float-cta-text"><svg width="16" height="16" aria-hidden="true" focusable="false"><use href="#ic-key"/></svg> 购买激活码</span>
</a>

<footer class="site-footer">
  <p>© {{ 'now' | date: "%Y" }} {{ site.title }} &nbsp;·&nbsp; 专注 AI 软件教程与激活指南 &nbsp;·&nbsp;
  <a href="{{ site.activation_site }}" target="_blank" rel="noopener">{{ site.activation_text }}</a></p>
</footer>

<script>
(function() {
  'use strict';

  // ── 移动端菜单 ──────────────────────────────
  var toggle = document.getElementById('menuToggle');
  var mobileNav = document.getElementById('mobileNav');
  var isOpen = false;

  function openMenu() {
    isOpen = true;
    toggle.classList.add('open');
    toggle.setAttribute('aria-expanded', 'true');
    mobileNav.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeMenu() {
    isOpen = false;
    toggle.classList.remove('open');
    toggle.setAttribute('aria-expanded', 'false');
    mobileNav.classList.remove('open');
    document.body.style.overflow = '';
  }
  toggle.addEventListener('click', function() {
    isOpen ? closeMenu() : openMenu();
  });
  mobileNav.querySelectorAll('a').forEach(function(a) {
    a.addEventListener('click', closeMenu);
  });
  document.addEventListener('click', function(e) {
    if (isOpen && !mobileNav.contains(e.target) && !toggle.contains(e.target)) closeMenu();
  });

  // ── 阅读进度条 ──────────────────────────────
  var bar = document.getElementById('progress-bar');
  function updateProgress() {
    var scrolled = window.scrollY;
    var total = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (total > 0 ? (scrolled / total * 100) : 0) + '%';
  }
  window.addEventListener('scroll', updateProgress, { passive: true });

  // ── 返回顶部 ────────────────────────────────
  var backBtn = document.getElementById('back-to-top');
  window.addEventListener('scroll', function() {
    backBtn.classList.toggle('visible', window.scrollY > 400);
  }, { passive: true });
  backBtn.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

})();
</script>

</body>
</html>
