---
layout: default
title: "搜索"
description: "搜索网站文章与 AI Knowledge Base 常见问题。"
permalink: /search/
---

<div class="container search-page" style="padding-top:40px;padding-bottom:80px;">
  <div class="search-page-header">
    <h1 class="search-page-title">🔍 搜索站内内容</h1>
    <p class="search-page-desc">搜索文章与 AI Knowledge Base 问题、答案和关键词</p>
  </div>

  <div class="search-box-wrap">
    <div class="search-box">
      <svg class="search-box-icon" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6"/><path d="M15 15l-3.5-3.5"/></svg>
      <input type="search" id="searchInput" class="search-box-input" placeholder="输入关键词，如：ChatGPT、Token、隐私…" aria-label="搜索文章和常见问题" />
      <button class="search-box-clear" id="clearBtn" type="button" aria-label="清除搜索" onclick="clearSearch()">✕</button>
    </div>
  </div>

  <div id="searchStats" class="search-stats" aria-live="polite"></div>
  <div id="searchResults" class="posts-grid"></div>
  <div id="searchEmpty" class="empty-state" style="display:none;">
    <div class="empty-icon">🔍</div>
    <h2>没有找到匹配内容</h2>
    <p>试试其他关键词。</p>
  </div>
  <div id="searchError" class="empty-state" style="display:none;">
    <h2>暂时无法加载搜索数据</h2>
    <p>请稍后重试，或直接浏览 <a href="{{ '/faq/' | relative_url }}">AI Knowledge Base</a>。</p>
  </div>
  <div id="searchDefault" class="search-default">
    <div class="section-label">📄 全部文章</div>
    <div id="allPosts" class="posts-grid"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var allData = [];
  var searchInput = document.getElementById('searchInput');
  var searchResults = document.getElementById('searchResults');
  var searchEmpty = document.getElementById('searchEmpty');
  var searchDefault = document.getElementById('searchDefault');
  var searchStats = document.getElementById('searchStats');
  var searchError = document.getElementById('searchError');
  var clearBtn = document.getElementById('clearBtn');
  var allPosts = document.getElementById('allPosts');
  var catMap = { tutorial:'AI教程', download:'软件下载', activation:'激活教程', faq:'AI Knowledge Base' };
  var catClass = { tutorial:'cat-tutorial', download:'cat-download', activation:'cat-activation', faq:'cat-faq' };

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function safeText(value) { return String(value == null ? '' : value); }
  function highlight(value, keyword) {
    var safe = esc(value);
    if (!keyword) return safe;
    var escapedKeyword = safeText(keyword).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    try { return safe.replace(new RegExp('(' + escapedKeyword + ')','gi'), '<mark>$1</mark>'); }
    catch (error) { return safe; }
  }
  function renderPost(item, keyword) {
    var category = safeText(item.categories).split(',')[0] || '';
    var cover = item.cover
      ? '<img src="' + esc(item.cover) + '" alt="' + esc(item.title) + '" loading="lazy" style="width:100%;height:100%;object-fit:cover;" />'
      : '<div class="post-cover-placeholder">' + (category === 'tutorial' ? '🤖' : category === 'download' ? '💾' : category === 'activation' ? '🔑' : '📄') + '</div>';
    var date = safeText(item.date);
    return '<a class="post-card" href="' + esc(item.url) + '">' +
      '<div class="post-cover">' + cover + '</div>' +
      '<div class="post-body"><div class="post-meta">' +
      '<span class="post-cat ' + (catClass[category] || '') + '">' + esc(catMap[category] || category) + '</span>' +
      (date ? '<span class="post-date">' + esc(date.slice(5)) + '</span>' : '') +
      '</div><div class="post-title">' + highlight(item.title, keyword) + '</div>' +
      '<div class="post-excerpt">' + highlight(item.excerpt, keyword) + '</div></div>' +
      '<div class="post-footer"><span class="read-more">阅读全文 <span class="read-more-arrow">→</span></span></div></a>';
  }
  function faqStatus(status) {
    if (status === 'published') return ['已发布', 'faq-status-published'];
    if (status === 'research_draft_community_gaps') return ['研究草稿 · 社区证据待补', 'faq-status-draft'];
    return ['待研究', 'faq-status-pending'];
  }
  function renderFaq(item, keyword) {
    var status = faqStatus(item.status);
    return '<a class="faq-search-result" href="' + esc(item.url) + '">' +
      '<div class="faq-search-result-top"><span class="faq-search-category">' + esc(item.category_name || 'AI Knowledge Base') + '</span>' +
      '<span class="faq-status-badge ' + status[1] + '">' + status[0] + '</span></div>' +
      '<h2>' + highlight(item.title, keyword) + '</h2>' +
      '<p>' + highlight(item.excerpt, keyword) + '</p>' +
      '<span class="faq-search-read">查看问题 →</span></a>';
  }
  function render(item, keyword) { return item.kind === 'faq' ? renderFaq(item, keyword) : renderPost(item, keyword); }

  function doSearch(value) {
    var keyword = safeText(value).trim();
    clearBtn.style.display = keyword ? 'flex' : 'none';
    searchError.style.display = 'none';
    if (!keyword) {
      searchResults.innerHTML = '';
      searchEmpty.style.display = 'none';
      searchDefault.style.display = 'block';
      searchStats.innerHTML = '';
      return;
    }
    searchDefault.style.display = 'none';
    var lower = keyword.toLocaleLowerCase();
    var results = allData.filter(function (item) {
      var searchable = [item.title, item.excerpt, item.tags, item.categories, item.category_name, item.category_description, item.search_text].map(safeText).join(' ').toLocaleLowerCase();
      return searchable.indexOf(lower) !== -1;
    });
    searchStats.innerHTML = results.length
      ? '找到 <strong>' + results.length + '</strong> 条相关内容'
      : '';
    searchEmpty.style.display = results.length ? 'none' : 'block';
    searchResults.innerHTML = results.map(function (item) { return render(item, keyword); }).join('');
  }
  window.clearSearch = function () {
    searchInput.value = '';
    searchInput.focus();
    doSearch('');
    var url = new URL(window.location.href);
    url.searchParams.delete('q');
    window.history.replaceState({}, '', url.pathname + url.search + url.hash);
  };
  searchInput.addEventListener('input', function () { doSearch(this.value); });
  searchInput.addEventListener('keydown', function (event) { if (event.key === 'Escape') window.clearSearch(); });

  fetch('{{ "/search.json" | relative_url }}')
    .then(function (response) { if (!response.ok) throw new Error('search index unavailable'); return response.json(); })
    .then(function (data) {
      allData = Array.isArray(data) ? data : [];
      allPosts.innerHTML = allData.filter(function (item) { return item.kind !== 'faq'; }).map(function (item) { return renderPost(item, ''); }).join('');
      var params = new URLSearchParams(window.location.search);
      var initialQuery = params.get('q') || '';
      searchInput.value = initialQuery;
      if (initialQuery) doSearch(initialQuery);
    })
    .catch(function () {
      searchDefault.style.display = 'none';
      searchError.style.display = 'block';
    });
})();
</script>
